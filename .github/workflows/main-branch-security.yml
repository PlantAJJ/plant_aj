name: Main branch security checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
    dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if package-lock.json exists
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.lockfile.outputs.exists == 'true'
        run: npm ci

      - name: Run npm security audit
        if: steps.lockfile.outputs.exists == 'true'
        run: npm audit --audit-level=high

      - name: Skip dependency audit
        if: steps.lockfile.outputs.exists == 'false'
        run: echo "No package-lock.json found. Dependency audit skipped."

  codeql-analysis:
    name: CodeQL security analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
