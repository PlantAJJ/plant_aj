name: Style Check CI

on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run style check
      run: npm run style:check